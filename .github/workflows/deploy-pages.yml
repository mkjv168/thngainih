name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to publish (including cron content commit)
        type: string
        required: false
        default: ''
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
