name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to publish (including cron content commit)
        type: string
        required: false
        default: ''
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build quiz pages and shaped cards
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b
          python -m pip install 'pillow>=10'
          python -c "from PIL import features; assert features.check('raqm'), 'RAQM missing'"
          python tools/build.py
          python tools/build_daily.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
