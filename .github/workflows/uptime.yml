name: Uptime
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check configured URLs
        env:
          UPTIME_URLS: ${{ vars.UPTIME_URLS }}
        run: python3 tools/uptime_check.py
