<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title><meta name="description" content="$tagline">
<link rel="canonical" href="$url"><meta property="og:url" content="$url">
<meta property="og:title" content="$title"><meta property="og:description" content="$tagline">
<meta property="og:type" content="website"><meta property="og:image" content="$image">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="$alt"><meta property="og:image:type" content="image/png">
<meta property="og:locale" content="en_US"><meta property="og:locale:alternate" content="km_KH">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../../styles.css"><link rel="icon" href="../../favicon.svg">
<script src="../../js/config.js" defer></script><script type="module" src="../../js/result.js"></script>
</head><body>
<header class="container"><a class="brand" href="../../">$site_name</a><button id="language-toggle" type="button" aria-pressed="false">{{km:html.templates.result.1}}</button></header>
<main class="container result" data-result="$id">
<p class="emoji" aria-hidden="true">$emoji</p>
<h1 class="names"><span lang="en" class="current" data-name="en">$name_en</span><span lang="km" data-name="km">$name_km</span></h1>
<p id="tagline">$tagline</p><p id="description">$description</p><p id="comparison" hidden></p>
<img src="og.png" width="1200" height="630" alt="$alt">
<p data-i18n="result.saveHint" id="save-hint">{{km:html.templates.result.2}}</p>
<div class="actions">
<button data-i18n="quiz.shareButton" id="native-share" hidden>Share</button>
<a id="facebook" data-channel="facebook" target="_blank" rel="noopener" href="$facebook">Facebook</a>
<a id="messenger" data-channel="messenger" hidden href="fb-messenger://share/?link=$encoded">Messenger</a>
<a id="telegram" data-channel="telegram" target="_blank" rel="noopener" href="$telegram">Telegram</a>
<button id="copy-link">Copy link</button>
</div><p class="feedback" id="feedback" role="status"></p>
<a class="primary" id="retake" href="../../quiz/">{{en:html.templates.result.3}}</a>
<p><a class="primary" data-i18n="quiz.bridge" id="today-link" href="../../">{{en:quiz.bridge}}</a></p>
</main><footer class="container"><a href="../../privacy/" data-i18n="privacy">Privacy</a></footer></body></html>
