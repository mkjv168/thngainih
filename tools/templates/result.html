<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title><meta name="description" content="$tagline">
<link rel="canonical" href="$url"><meta property="og:url" content="$url">
<meta property="og:title" content="$title"><meta property="og:description" content="$tagline">
<meta property="og:type" content="website"><meta property="og:image" content="$image">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="$alt"><meta property="og:image:type" content="image/png">
<meta property="og:locale" content="en_US"><meta property="og:locale:alternate" content="km_KH">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../../styles.css"><link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="icon" href="../../icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<script src="../../js/config.js" defer></script><script type="module" src="../../js/result.js"></script>
</head><body>
<header class="container"><a class="brand" href="../../"><span class="mark" data-logo data-i18n="name">{{km:name}}</span></a><button id="language-toggle" type="button" aria-pressed="false" data-i18n-attr="aria-label:toggleLabel">{{km:html.templates.result.1}}</button></header>
<a class="skip" href="#content" data-i18n="skip">Skip to content</a>
<main id="content" class="container result" data-result="$id">
<div class="result-card silk" style="$silk_style">
<div class="band t orn orn-border"></div><div class="band b orn orn-border"></div><div class="frame"></div>
<div class="result-in"><div class="result-kicker" data-i18n="quiz.title">{{en:quiz.title}}</div>
<div class="medallion"><div class="ring"></div><img src="../../assets/dish/$id.svg" width="134" height="134" alt=""></div>
<div class="result-iam" lang="km">{{km:card.iam}}</div>
<h1 class="result-name" lang="km">$name_km</h1><div class="result-en" lang="en">$name_en</div>
</div></div>
<a id="save-story" href="story.png" download="thngainih-$id-story.png" data-i18n="result.saveStory">{{en:result.saveStory}}</a><p id="story-feedback" class="feedback" role="status"></p>
<p id="tagline" class="result-body">$tagline</p>
<div class="result-fact"><div class="t13" data-i18n="card.didYouKnow">{{en:card.didYouKnow}}</div><p id="description">$description</p></div><p id="comparison" hidden></p>
<div class="result-actions result-share">
<button class="primary" data-i18n="quiz.shareButton" id="native-share">Share</button>
<div class="row"><a id="telegram" data-channel="telegram" target="_blank" rel="noopener" href="$telegram">Telegram</a><a id="facebook" data-channel="facebook" target="_blank" rel="noopener" href="$facebook">Facebook</a><button id="copy-link">Copy link</button><a id="messenger" data-channel="messenger" hidden href="fb-messenger://share/?link=$encoded">Messenger</a></div>
</div><p class="feedback" id="feedback" role="status"></p>
<div class="orn orn-divider rule"></div>
<a data-i18n="quiz.bridge" id="today-link" href="../../">{{en:quiz.bridge}}</a>
<a id="retake" class="secondary-btn" href="../../quiz/" data-i18n="result.playAgain">{{en:result.playAgain}}</a>
</main><footer class="container"><p data-i18n="quiz.footer">{{en:quiz.footer}}</p><a href="../../privacy/" data-i18n="privacy">Privacy</a></footer></body></html>
